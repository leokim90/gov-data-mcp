# npm Trusted Publishing (OIDC) — 토큰 없이 배포한다.
# 트리거: v로 시작하는 태그 푸시 (예: git tag v0.1.8 && git push --tags)
# npm 쪽 설정: 패키지 Settings → Trusted Publisher 에 이 레포와 파일명(publish.yml)을 등록해야 동작한다.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 수동으로도 돌려볼 수 있게 열어둔다 (설정 검증용)
  workflow_dispatch:

permissions:
  # OIDC 토큰 발급에 필수 — 이게 없으면 npm이 신원을 확인하지 못해 인증 실패한다
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing은 npm 11.5.1+ / Node 22.14+ 필요
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node가 붙여주는 npm 버전이 낮을 수 있어 명시적으로 올린다
      - name: npm 버전 확인 및 갱신
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # 배포 전 게이트: 테스트가 깨지면 배포하지 않는다
      - run: npm test

      # 태그 버전과 package.json 버전이 어긋난 채 배포되는 사고를 막는다
      - name: 태그와 package.json 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "태그($TAG_VERSION)와 package.json($PKG_VERSION) 버전이 다릅니다. 배포를 중단합니다."
            exit 1
          fi
          echo "버전 일치: $PKG_VERSION"

      # 토큰 불필요 — OIDC로 인증하고 provenance(출처 증명)도 자동 첨부된다
      - run: npm publish --access public
